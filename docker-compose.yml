services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scannai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://127.0.0.1"]
      - MAX_UPLOAD_SIZE_MB=25
    networks:
      - scannai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scannai-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - scannai-network

networks:
  scannai-network:
    driver: bridge
